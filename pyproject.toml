[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "central-ia-pessoal"
version = "0.1.0"
description = "Orquestrador pessoal local com simulação sem API"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["central*"]

[project.optional-dependencies]
gemini = ["google-genai==2.34.0", "python-dotenv==1.2.4"]
dev = ["google-genai==2.34.0", "python-dotenv==1.2.4", "pytest==9.2.0", "ruff==0.17.3", "bandit==1.9.4", "PyYAML==6.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Regras de correção; estilo legado é preservado, sem reformatação das fases.
select = ["E9", "F63", "F7", "F82"]

[tool.bandit]
# Asserts são usados em verificações locais, não como controle do transporte.
skips = ["B101"]
