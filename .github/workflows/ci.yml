name: CI
'on':
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: ${{ vars.CENTRAL_CI_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CENTRAL_PROVIDER: mock
      CENTRAL_ALLOW_PAID: 'false'
      P3_MODE: mock
      P3_ENABLE_OPENAI: 'false'
      P3_PRICES_ACK: 'false'
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      INTEGRATIONS_ENABLE_REAL: 'false'
      INTEGRATIONS_PRICES_ACK: 'false'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Guard publication boundary
        run: python tools/security_check.py
      - name: Install declared tools
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Workflow and automation contracts
        run: python tools/validate_automation.py
      - name: Ruff correctness rules
        run: python -m ruff check central tests tools
      - name: Bandit production code
        run: python tools/run_bandit.py
      - name: Pytest without API
        run: python -m pytest -q
