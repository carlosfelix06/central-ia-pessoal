name: Copilot event coordinator
'on':
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write
concurrency:
  group: central-copilot-coordinator
  cancel-in-progress: false
jobs:
  coordinate:
    if: >-
      ${{ vars.CENTRAL_AI_ENABLED == 'true' &&
          github.repository == 'carlosfelix06/central-ia-pessoal' &&
          (github.event.workflow_run.conclusion == 'failure' ||
           github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: copilot-automation
    steps:
      # Privileged workflow_run: NEVER checkout the PR or download its artifacts.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Supervised event dispatch
        env:
          GH_METADATA_TOKEN: ${{ github.token }}
          COPILOT_AUTOMATION_TOKEN: ${{ secrets.COPILOT_AUTOMATION_TOKEN }}
          CENTRAL_AI_ENABLED: ${{ vars.CENTRAL_AI_ENABLED }}
          CENTRAL_COPILOT_FAILURE_ENABLED: ${{ vars.CENTRAL_COPILOT_FAILURE_ENABLED }}
          CENTRAL_COPILOT_REVIEW_ENABLED: ${{ vars.CENTRAL_COPILOT_REVIEW_ENABLED }}
          CENTRAL_COPILOT_TOOLS_REVIEWED: ${{ vars.CENTRAL_COPILOT_TOOLS_REVIEWED }}
          COPILOT_FAILURE_AUTOMATION_ID: ${{ vars.COPILOT_FAILURE_AUTOMATION_ID }}
          COPILOT_REVIEW_AUTOMATION_ID: ${{ vars.COPILOT_REVIEW_AUTOMATION_ID }}
        run: python tools/coordinate_copilot.py
